name: aidlp-managed
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: aidlp
      POSTGRES_USER: aidlp
      POSTGRES_PASSWORD: ${AIDLP_DB_PASSWORD:?Run npm run bootstrap first}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - aidlp_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlp -d aidlp"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  aidlp_pg:
