[package]
name = "aidlp-native"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
time = "0.3"
x509-parser = "0.18"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
mime = "0.3"
tower-service = "0.3"
socket2 = "0.6"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
mitmproxy = { path = "third_party/mitmproxy_rs" }
hudsucker = { path = "../research/hudsucker-spike/vendor/hudsucker", default-features = false, features = ["rcgen-ca", "http2"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows = {version="0.62",features=["Win32_Foundation","Win32_System_JobObjects","Win32_System_Threading","Win32_System_ProcessStatus","Win32_Security","Win32_Security_Cryptography"]}

[dev-dependencies]
tempfile = "3"
